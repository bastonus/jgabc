name: Process Alignment Reviews

on:
  issue_comment:
    types: [created]
  issues:
    types: [labeled]

concurrency:
  group: alignment-reviews-queue
  cancel-in-progress: false

jobs:
  approve-reviews:
    if: >
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/approve')) ||
      (github.event_name == 'issues' && github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Approve and publish reviews
        id: approve
        run: |
          python tools/review_queue.py approve \
            --issue-number "${{ github.event.issue.number }}" \
            --approved-by "${{ github.event.comment.user.login || github.event.sender.login }}"

      - name: Commit and push published reviews and assets
        if: steps.approve.outputs.approved_count != '0' && steps.approve.outputs.approved_count != ''
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pipeline/lab_reviews.json pipeline/reviews/ js/gregorian_preprocessed_timestamps.js data/gregorian_alignments.min.json pipeline/lab_data.js www/
          git diff --staged --quiet || git commit -m "feat(reviews): publish ${{ steps.approve.outputs.approved_count }} approved reviews from #${{ github.event.issue.number }}"
          for i in 1 2 3 4 5; do
            git fetch origin master && git rebase origin/master && git push origin master && break || sleep 2
          done

      - name: Update issue and close
        if: steps.approve.outputs.approved_count != '0' && steps.approve.outputs.approved_count != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'pending-review'
              });
            } catch(e) {}
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['published']
              });
            } catch(e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "${{ steps.approve.outputs.approved_count }} avis validés et intégrés avec succès dans `pipeline/lab_reviews.json` et compilés en production. Total des pièces révisées dans le dépôt : ${{ steps.approve.outputs.published_total }}."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

  reject-reviews:
    if: >
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/reject')) ||
      (github.event_name == 'issues' && github.event.label.name == 'rejected')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reject reviews
        id: reject
        run: |
          python tools/review_queue.py reject \
            --issue-number "${{ github.event.issue.number }}" \
            --reason "${{ github.event.comment.body || 'Rejet par label' }}" \
            --rejected-by "${{ github.event.comment.user.login || github.event.sender.login }}"

      - name: Commit and push rejected reviews
        if: steps.reject.outputs.rejected_count != '0' && steps.reject.outputs.rejected_count != ''
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pipeline/reviews/
          git diff --staged --quiet || git commit -m "chore(reviews): reject ${{ steps.reject.outputs.rejected_count }} reviews from #${{ github.event.issue.number }}"
          for i in 1 2 3 4 5; do
            git fetch origin master && git rebase origin/master && git push origin master && break || sleep 2
          done

      - name: Update issue and close
        if: steps.reject.outputs.rejected_count != '0' && steps.reject.outputs.rejected_count != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: 'pending-review'
              });
            } catch(e) {}
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['rejected']
              });
            } catch(e) {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Les avis associés à ce ticket ont été rejetés et archivés dans `pipeline/reviews/rejected/`."
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
