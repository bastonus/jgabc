# Aider configuration for Local Qwen 3.8 Proxy
# Documentation: https://aider.chat/docs/config.html

# Use the openai/ prefix to force OpenAI-compatible API usage
model: openai/qwen3.8-max

# Point to your local QwenFreeApi proxy
openai-api-base: http://localhost:3265/v1

# Dummy API key required by the OpenAI client (your proxy doesn't validate it)
openai-api-key: sk-qwen-free-api

# Optional: Use qwen3-coder-plus for weaker/smaller tasks if desired
# weak-model: openai/qwen3-coder-plus

# Recommended settings for local/custom models
verify-ssl: false
edit-format: diff
