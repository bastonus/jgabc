<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Alignement Grégorien — Oremus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/modern.css">
  <link rel="stylesheet" href="../css/divinum_officium.css">
  <script src="../jquery.min.js"></script>
  <script src="../exsurge.min.js"></script>
  <script src="lab_data.js?v=20260915_v3"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --primary-color: #c96b63;
      --primary-color-rgb: 201, 107, 99;
      --background-base: #121214;
      --background-card: #1a1a1e;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #f4f4f6;
      --text-secondary: #a1a1aa;
      --text-tertiary: #71717a;
      --status-success: #589c77;
      --status-warning: #c4984f;
      --status-danger: #c96b63;
    }
    [data-theme="light"] {
      --background-base: #f7f7f9;
      --background-card: #ffffff;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.16);
      --text-primary: #18181b;
      --text-secondary: #71717a;
      --text-tertiary: #a1a1aa;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--background-base);
      color: var(--text-primary);
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Top Bar ── */
    .tinder-top-bar {
      height: 44px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--background-base);
      z-index: 100;
    }
    .tinder-nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.15s ease;
    }
    .tinder-nav-link:hover { color: var(--text-primary); }

    .tinder-counter {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .tinder-top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .tinder-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.15s ease;
    }
    .tinder-icon-btn:hover { color: var(--text-primary); }

    /* ── Main Viewport ── */
    .tinder-viewport {
      position: absolute;
      top: 44px;
      bottom: 84px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      overflow: hidden;
    }

    /* ── Tinder Swipable Card ── */
    .tinder-card {
      width: 100%;
      max-width: 760px;
      height: 100%;
      background: var(--background-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      position: relative;
      touch-action: none;
      will-change: transform, opacity, box-shadow, border-color;
      overflow: hidden;
    }
    .tinder-card.animate-in {
      animation: cardEntrance 0.32s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    @keyframes cardEntrance {
      0% {
        transform: scale(0.9) translateY(24px);
        opacity: 0;
      }
      100% {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    /* ── Tinder Stamp Badges ── */
    .tinder-stamp {
      position: absolute;
      padding: 8px 20px;
      font-size: 1.35rem;
      font-weight: 800;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .tinder-stamp-right {
      top: 24px;
      left: 24px;
      color: #10b981;
      border: 3.5px solid #10b981;
      background: rgba(16, 185, 129, 0.28);
      transform: rotate(-14deg) scale(0.9);
    }
    .tinder-stamp-left {
      top: 24px;
      right: 24px;
      color: #f59e0b;
      border: 3.5px solid #f59e0b;
      background: rgba(245, 158, 11, 0.28);
      transform: rotate(14deg) scale(0.9);
    }
    .tinder-stamp-down {
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      color: #ef4444;
      border: 3.5px solid #ef4444;
      background: rgba(239, 68, 68, 0.28);
    }

    /* ── Inside Card Content ── */
    .card-video-slot {
      width: 100%;
      background: #000;
      position: relative;
      padding-bottom: 44%; /* Compact 16:9 ratio */
      height: 0;
      flex-shrink: 0;
    }
    @media (max-width: 600px) {
      .card-video-slot { padding-bottom: 54%; }
    }
    .card-video-slot iframe, .card-video-slot div {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Drag Handle Strip */
    .card-drag-strip {
      width: 100%;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--background-card);
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
      cursor: grab;
      flex-shrink: 0;
      touch-action: none;
    }
    .card-drag-strip:active { cursor: grabbing; }
    .card-drag-pill {
      width: 44px;
      height: 5px;
      background: color-mix(in srgb, var(--text-secondary) 40%, transparent);
      border-radius: 4px;
      transition: background 0.15s ease, width 0.15s ease;
    }
    .card-drag-strip:hover .card-drag-pill {
      background: var(--primary-color);
      width: 54px;
    }

    /* Gregorian Score in Card */
    .card-score-slot {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #fdfbf7;
      color: #18181b;
      cursor: grab;
      touch-action: pan-y; /* Allows vertical scrolling while horizontal drag is captured */
      min-height: 200px;
    }
    [data-theme="dark"] .card-score-slot {
      background: #18181c;
      color: #f4f4f6;
    }
    .card-score-slot svg text {
      font-family: 'Crimson Text', serif !important;
    }
    .card-score-slot svg use[source-index],
    .card-score-slot svg use[element-index],
    .card-score-slot svg text,
    .card-score-slot svg tspan {
      cursor: pointer;
    }

    /* Active Note & Syllable Highlight (Oremus Coral #c96b63) */
    .card-score-slot svg use.active,
    .card-score-slot svg use[source-index].active,
    .card-score-slot svg use[element-index].active,
    .card-score-slot svg text.active,
    .card-score-slot svg text.active tspan,
    .card-score-slot svg text.lyric.active,
    .card-score-slot svg text.lyric.active tspan,
    .card-score-slot svg text.dropCap.active,
    .card-score-slot svg text.aboveLinesText.active,
    .active-note-highlight {
      fill: #c96b63 !important;
      color: #c96b63 !important;
      filter: drop-shadow(0 0 5px rgba(201, 107, 99, 0.75)) !important;
    }

    /* ── Bottom Action Dock ── */
    .tinder-bottom-dock {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: var(--background-base);
      border-top: 1px solid var(--border-subtle);
      z-index: 100;
    }

    .tinder-dock-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--background-card);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      transition: all 0.15s cubic-bezier(0.2, 0.8, 0.3, 1);
      padding: 0;
    }
    .tinder-dock-btn:hover {
      transform: scale(1.1);
    }
    .tinder-dock-btn:active {
      transform: scale(0.92);
    }
    .tinder-dock-btn.btn-left {
      color: var(--status-warning);
      border-color: rgba(196, 152, 79, 0.4);
    }
    .tinder-dock-btn.btn-left:hover {
      background: var(--status-warning);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(196, 152, 79, 0.45);
    }
    .tinder-dock-btn.btn-center {
      color: var(--status-danger);
      border-color: rgba(201, 107, 99, 0.4);
    }
    .tinder-dock-btn.btn-center:hover {
      background: var(--status-danger);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(201, 107, 99, 0.45);
    }
    .tinder-dock-btn.btn-right {
      width: 60px;
      height: 60px;
      color: var(--status-success);
      border-color: rgba(88, 156, 119, 0.45);
    }
    .tinder-dock-btn.btn-right:hover {
      background: var(--status-success);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(88, 156, 119, 0.45);
    }
    .tinder-dock-btn.btn-undo {
      width: 38px;
      height: 38px;
      color: var(--text-tertiary);
    }
    .tinder-dock-btn.btn-undo:hover {
      color: var(--text-primary);
    }
    .tinder-dock-btn.btn-comment {
      width: 38px;
      height: 38px;
      color: var(--text-tertiary);
      position: relative;
    }
    .tinder-dock-btn.btn-comment:hover {
      color: var(--text-primary);
    }
    .tinder-dock-btn.btn-comment.has-comment {
      color: var(--primary-color);
      border-color: rgba(var(--primary-color-rgb), 0.5);
      background: rgba(var(--primary-color-rgb), 0.12);
    }

    /* Modal */
    .tinder-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .tinder-modal-sheet {
      background: var(--background-card);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 600px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Toast */
    #quickToast {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--background-card);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 10000;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- ── Minimal Top Navigation ── -->
  <header class="tinder-top-bar">
    <a href="../divinum-officium.html" class="tinder-nav-link" title="Quitter">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <span>Oremus</span>
    </a>

    <!-- Counter text -->
    <div class="tinder-counter" id="lblRemainingCounter">—</div>

    <div class="tinder-top-actions">
      <!-- History Button -->
      <button class="tinder-icon-btn" onclick="openHistoryModal()" title="Historique">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </button>

      <!-- Theme Switcher -->
      <button class="tinder-icon-btn" onclick="toggleTheme()" title="Thème">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Swipable Card Viewport ── -->
  <main class="tinder-viewport">
    <div class="tinder-card animate-in" id="activeSwipeCard">

      <!-- Dynamic Stamp Badges -->
      <div class="tinder-stamp tinder-stamp-right" id="stampConforme">Conforme</div>
      <div class="tinder-stamp tinder-stamp-left" id="stampDecalage">Décalage</div>
      <div class="tinder-stamp tinder-stamp-down" id="stampGabcFaux">GABC faux</div>

      <!-- Pure Video (No Titles) -->
      <div class="card-video-slot" id="cardVideoSlot">
        <div id="ytPlayerContainer"></div>
      </div>

      <!-- Tactile Drag Indicator Strip -->
      <div class="card-drag-strip" id="cardDragStrip" title="Glisser pour voter">
        <div class="card-drag-pill"></div>
      </div>

      <!-- Gregorian Score -->
      <div class="card-score-slot" id="cardScoreSlot">
        <div style="padding:40px; text-align:center; color:var(--text-tertiary);">Chargement...</div>
      </div>

    </div>
  </main>

  <!-- ── Bottom Action Dock ── -->
  <footer class="tinder-bottom-dock">
    <!-- Undo Button -->
    <button class="tinder-dock-btn btn-undo" onclick="undoLastVote()" title="Annuler le dernier vote">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7v6h6"></path>
        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
      </svg>
    </button>

    <!-- Décalage (Swipe Left) -->
    <button class="tinder-dock-btn btn-left" onclick="triggerVote('rejected')" title="Décalage temporel (Swipe gauche)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </button>

    <!-- GABC Faux (Swipe Down) -->
    <button class="tinder-dock-btn btn-center" onclick="triggerVote('bad_gabc')" title="Partition GABC fausse (Swipe bas)">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    </button>

    <!-- Conforme (Swipe Right) -->
    <button class="tinder-dock-btn btn-right" onclick="triggerVote('approved')" title="Conforme (Swipe droite)">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </button>

    <!-- Commentaire -->
    <button class="tinder-dock-btn btn-comment" id="btnComment" onclick="openCommentModal()" title="Ajouter un commentaire (touche C)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>
  </footer>

  <!-- ── Comment Modal ── -->
  <div class="tinder-modal-overlay" id="commentModal">
    <div class="tinder-modal-sheet" style="max-width: 440px;">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-subtle); padding-bottom:10px;">
        <span style="font-weight:700; font-size:0.95rem;">Commentaire</span>
        <button class="tinder-icon-btn" onclick="closeCommentModal()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <textarea id="chantCommentInput" placeholder="Préciser une remarque, un décalage, audio incomplet..." style="width:100%; height:110px; padding:10px 12px; background:var(--background-base); border:1px solid var(--border-strong); border-radius:8px; color:var(--text-primary); font-family:inherit; font-size:0.88rem; resize:vertical; outline:none; box-sizing:border-box;"></textarea>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:10px; padding-top:4px;">
        <button class="tinder-dock-btn" onclick="closeCommentModal()" style="width:auto; height:36px; border-radius:8px; padding:0 14px; font-size:0.82rem; font-weight:500;">Fermer</button>
        <button class="tinder-dock-btn" onclick="saveChantComment()" style="width:auto; height:36px; border-radius:8px; padding:0 16px; background:var(--primary-color); border-color:var(--primary-color); color:#fff; font-size:0.82rem; font-weight:600;">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- ── History Modal ── -->
  <div class="tinder-modal-overlay" id="historyModal">
    <div class="tinder-modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-subtle); padding-bottom:10px;">
        <span style="font-weight:700; font-size:0.95rem;">Historique des votes</span>
        <button class="tinder-icon-btn" onclick="closeHistoryModal()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div style="overflow-y:auto; flex:1; max-height:50vh;">
        <table style="width:100%; border-collapse:collapse; font-size:0.80rem;">
          <tbody id="historyTbody"></tbody>
        </table>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; padding-top:4px;">
        <button class="tinder-icon-btn" onclick="exportReviewsJson()" style="font-size:0.75rem; gap:6px;">
          <span>Exporter JSON</span>
        </button>
        <button class="tinder-icon-btn" onclick="closeHistoryModal()" style="font-size:0.75rem;">Fermer</button>
      </div>
    </div>
  </div>

  <div id="quickToast"></div>

  <!-- ── JavaScript Engine ── -->
  <script>
    let currentPieceIndex = -1;
    let ytPlayer = null;
    let isYtReady = false;
    let pendingYtId = null;
    let playbackInterval = null;
    let LAB_REVIEWS = {};
    let voteHistoryStack = [];
    let isTransitioning = false;

    let currentScore = null;
    let currentChantInfo = null;
    let activeNoteIndex = -1;
    let activeNoteEl = null;
    let activeLyricEl = null;

    function showToast(msg) {
      const t = document.getElementById('quickToast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 1600);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const cur = html.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('do_theme', next);
      if (currentPieceIndex >= 0 && PIECES && PIECES[currentPieceIndex]) {
        renderScore(PIECES[currentPieceIndex]);
      }
    }

    function initReviews() {
      try {
        const saved = localStorage.getItem('oremus_lab_reviews');
        if (saved) LAB_REVIEWS = JSON.parse(saved);
      } catch(e) { LAB_REVIEWS = {}; }
      updateCounterDisplay();

      fetch('/api/reviews', { method: 'GET', cache: 'no-store' })
        .then(r => r.ok ? r.json() : {})
        .then(serverData => {
          if (!serverData || typeof serverData !== 'object') serverData = {};

          for (const [k, v] of Object.entries(LAB_REVIEWS)) {
            if (v && v.status && (!serverData[k] || serverData[k].status !== v.status)) {
              const p = (typeof PIECES !== 'undefined' && Array.isArray(PIECES)) ? PIECES.find(x => x.id === k) : null;
              fetch('/api/review', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  piece_id: k,
                  status: v.status,
                  comment: v.comment || '',
                  reviewedAt: v.reviewedAt || new Date().toISOString(),
                  title: p ? (p.title || p.incipit) : '',
                  incipit: p ? p.incipit : '',
                  youtube_id: p ? p.youtube_id : ''
                })
              }).catch(() => {});
            }
          }

          LAB_REVIEWS = Object.assign({}, LAB_REVIEWS, serverData);
          try { localStorage.setItem('oremus_lab_reviews', JSON.stringify(LAB_REVIEWS)); } catch(e) {}
          updateCounterDisplay();
        }).catch(() => {});
    }

    function updateCounterDisplay() {
      let pending = 0;
      if (typeof PIECES !== 'undefined' && Array.isArray(PIECES)) {
        PIECES.forEach(p => {
          const r = LAB_REVIEWS[p.id];
          if (!r || !r.status) pending++;
        });
      }
      document.getElementById('lblRemainingCounter').textContent = pending + ' restants';
    }

    // Pick Next Random Chant (skips already verified)
    function pickNextRandomChant() {
      if (!PIECES || PIECES.length === 0) return;
      const unverified = [];
      PIECES.forEach((p, idx) => {
        const r = LAB_REVIEWS[p.id];
        if (!r || !r.status) unverified.push(idx);
      });

      if (unverified.length === 0) {
        showToast('Toutes les pièces sont vérifiées !');
        return;
      }
      const pool = unverified.filter(i => i !== currentPieceIndex);
      const chosen = pool.length > 0 ? pool[Math.floor(Math.random() * pool.length)] : unverified[0];
      loadPiece(chosen);
    }

    function loadPiece(index) {
      if (!PIECES || index < 0 || index >= PIECES.length) return;
      currentPieceIndex = index;
      const piece = PIECES[index];

      loadYouTubeVideo(piece.youtube_id);
      renderScore(piece);
      updateCounterDisplay();
      updateCommentButtonState();

      // Reset card visual state and animate entrance smoothly
      const c = document.getElementById('activeSwipeCard');
      c.style.transition = 'none';
      c.style.transform = 'scale(0.92) translateY(24px)';
      c.style.opacity = '0';
      c.style.borderColor = 'var(--border-subtle)';
      c.style.boxShadow = '0 10px 30px rgba(0, 0, 0, 0.3)';
      resetStamps();

      void c.offsetWidth; // force reflow
      c.style.transition = 'transform 0.32s cubic-bezier(0.18, 0.89, 0.32, 1.15), opacity 0.25s ease';
      c.style.transform = 'scale(1) translateY(0)';
      c.style.opacity = '1';
      isTransitioning = false;
    }

    function autoSaveVote(pieceId, status) {
      if (!LAB_REVIEWS[pieceId]) LAB_REVIEWS[pieceId] = {};
      LAB_REVIEWS[pieceId].status = status;
      LAB_REVIEWS[pieceId].reviewedAt = new Date().toISOString();

      try {
        localStorage.setItem('oremus_lab_reviews', JSON.stringify(LAB_REVIEWS));
      } catch(e) {}

      const p = PIECES ? PIECES.find(x => x.id === pieceId) : null;
      fetch('/api/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          piece_id: pieceId,
          status: status,
          comment: (LAB_REVIEWS[pieceId] && LAB_REVIEWS[pieceId].comment) ? LAB_REVIEWS[pieceId].comment : '',
          reviewedAt: LAB_REVIEWS[pieceId].reviewedAt,
          title: p ? (p.title || p.incipit) : '',
          incipit: p ? p.incipit : '',
          youtube_id: p ? p.youtube_id : ''
        })
      }).catch(() => {});

      voteHistoryStack.push({ id: pieceId, status: status, index: currentPieceIndex });
      updateCounterDisplay();
    }

    function undoLastVote() {
      if (voteHistoryStack.length === 0) {
        showToast('Aucun vote à annuler.');
        return;
      }
      const last = voteHistoryStack.pop();
      if (LAB_REVIEWS[last.id]) {
        delete LAB_REVIEWS[last.id].status;
        try { localStorage.setItem('oremus_lab_reviews', JSON.stringify(LAB_REVIEWS)); } catch(e) {}
        fetch('/api/review', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ piece_id: last.id, status: '' })
        }).catch(() => {});
      }
      loadPiece(last.index);
      showToast('Dernier vote annulé.');
    }

    // ── Ultra-Satisfying Animated Vote Trigger ──
    function triggerVote(status) {
      if (isTransitioning || currentPieceIndex < 0 || !PIECES[currentPieceIndex]) return;
      isTransitioning = true;

      const c = document.getElementById('activeSwipeCard');
      const piece = PIECES[currentPieceIndex];

      // Auto-save immediately in background
      autoSaveVote(piece.id, status);

      // Play dramatic, visible swipe animation
      c.style.transition = 'transform 0.36s cubic-bezier(0.2, 0.9, 0.25, 1), opacity 0.32s ease, box-shadow 0.32s ease, border-color 0.32s ease';

      if (status === 'approved') {
        stampRight.style.opacity = '1';
        stampRight.style.transform = 'rotate(-14deg) scale(1.2)';
        c.style.transform = 'translate(120vw, 40px) rotate(26deg)';
        c.style.opacity = '0';
        c.style.borderColor = '#10b981';
        c.style.boxShadow = '0 24px 70px rgba(16, 185, 129, 0.6)';
      } else if (status === 'rejected') {
        stampLeft.style.opacity = '1';
        stampLeft.style.transform = 'rotate(14deg) scale(1.2)';
        c.style.transform = 'translate(-120vw, 40px) rotate(-26deg)';
        c.style.opacity = '0';
        c.style.borderColor = '#f59e0b';
        c.style.boxShadow = '0 24px 70px rgba(245, 158, 11, 0.6)';
      } else {
        stampDown.style.opacity = '1';
        stampDown.style.transform = 'translateX(-50%) scale(1.2)';
        c.style.transform = 'translate(0, 120vh) scale(0.85)';
        c.style.opacity = '0';
        c.style.borderColor = '#ef4444';
        c.style.boxShadow = '0 24px 70px rgba(239, 68, 68, 0.6)';
      }

      setTimeout(() => {
        pickNextRandomChant();
      }, 340);
    }

    // ── YouTube Player Setup & Synchronization ──
    let ytReady = false;
    let pendingAttach = null;

    window.onYouTubeIframeAPIReady = function() {
      ytReady = true;
      if (typeof pendingAttach === 'function') {
        pendingAttach();
        pendingAttach = null;
      }
    };

    function loadYouTubeVideo(videoId) {
      if (playbackInterval) {
        clearInterval(playbackInterval);
        playbackInterval = null;
      }

      if (ytPlayer && typeof ytPlayer.destroy === 'function') {
        try { ytPlayer.destroy(); } catch(e) {}
        ytPlayer = null;
      }
      ytReady = false;

      const slot = document.getElementById('cardVideoSlot');
      if (!slot) return;

      if (!videoId) {
        slot.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-tertiary);font-size:13px;">Aucune vidéo disponible pour ce chant</div>';
        return;
      }

      const originParam = (window.location.protocol === 'http:' || window.location.protocol === 'https:')
        ? ('&origin=' + encodeURIComponent(window.location.origin))
        : '';
      const embedUrl = 'https://www.youtube.com/embed/' + videoId + '?enablejsapi=1&autoplay=1&controls=1&modestbranding=1&rel=0&playsinline=1' + originParam;

      slot.innerHTML = '<iframe id="ytPlayerSlot" src="' + embedUrl + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;"></iframe>';

      function attachPlayer() {
        if (!window.YT || !window.YT.Player) {
          pendingAttach = attachPlayer;
          setTimeout(attachPlayer, 100);
          return;
        }
        try {
          ytPlayer = new YT.Player('ytPlayerSlot', {
            events: {
              onReady: function() {
                ytReady = true;
                startSyncTracker();
              },
              onStateChange: function(event) {
                if (event.data === YT.PlayerState.PLAYING) {
                  startSyncTracker();
                }
              }
            }
          });
        } catch(err) {
          console.warn('YT.Player attach error:', err);
        }
      }

      attachPlayer();
      startSyncTracker();
    }

    function startSyncTracker() {
      if (playbackInterval) clearInterval(playbackInterval);
      playbackInterval = setInterval(function() {
        if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
        try {
          var cur = ytPlayer.getCurrentTime();
          if (typeof cur === 'number' && !isNaN(cur)) {
            syncActiveNote(cur);
          }
        } catch(e) {}
      }, 35);
    }

    function stopSyncTracker() {
      if (playbackInterval) clearInterval(playbackInterval);
      playbackInterval = null;
    }

    // ── Exsurge Gregorian Score Rendering ──
    function preprocessGabcForExsurge(gabc) {
      if (!gabc) return '';
      gabc = gabc.replace(/<sp>['’]<\/sp>/g, "'");
      gabc = gabc.replace(/<v>\\([VRA])bar<\/v>/gi, function(m, b) { return b.toUpperCase() + '/.'; })
                 .replace(/<sp>([VRA])\/?<\/sp>\.?/gi, function(m, b) { return b.toUpperCase() + '/.'; });
      gabc = gabc.replace(/(^|\s|\))<i>\s*(Ps\.?|Psalmus)\s*<\/i>/gi, '$1<c><i>Ps.</i></c>');
      gabc = gabc.replace(/(^|\s|\))(Ps\.)(?=\s+[A-ZÁÉÍÓÚ])/g, '$1<c><i>Ps.</i></c>');
      gabc = gabc.replace(/(^|\s|\))<i>\s*([V℣]\.?|Versus)\s*<\/i>/gi, '$1<c><i>℣.</i></c>');
      gabc = gabc.replace(/(^|\s|\))(V\/\.?)(?=\s*[0-9A-ZÁÉÍÓÚ(])/g, '$1<c><i>℣.</i></c>');
      gabc = gabc.replace(/(^|\s|\))<i>\s*([R℟]\.?|Responsorium)\s*<\/i>/gi, '$1<c><i>℟.</i></c>');
      gabc = gabc.replace(/(^|\s|\))(R\/\.?)(?=\s*[0-9A-ZÁÉÍÓÚ(])/g, '$1<c><i>℟.</i></c>');
      return gabc;
    }

    function _getChantInfo(score) {
      if (!score || !score.notations) return null;
      var allNotes = [].concat.apply([], score.notations.map(function(n){ return n.notes || []; }))
                              .filter(function(n){ return n && !n.isAccidental; });
      return { allNotes: allNotes, score: score };
    }

    function renderScore(piece) {
      const container = document.getElementById('cardScoreSlot');
      container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-tertiary);">Chargement de la partition...</div>';

      if (!piece.gabc_src) {
        container.innerHTML = '<div style="padding:40px; text-align:center; color:var(--text-tertiary);">Partition GABC non disponible.</div>';
        return;
      }

      try {
        const ctxt = new exsurge.ChantContext();
        const curTheme = document.documentElement.getAttribute('data-theme') || 'dark';
        const isDark = (curTheme !== 'light');
        const accentColor = '#c96b63';

        ctxt.textColor = isDark ? '#ffffff' : '#111317';
        ctxt.noteColor = isDark ? '#ffffff' : '#111317';
        ctxt.neumeLineColor = isDark ? '#ffffff' : '#111317';
        ctxt.dividerLineColor = isDark ? '#ffffff' : '#111317';
        ctxt.staffLineColor = isDark ? 'rgba(255, 255, 255, 0.45)' : 'rgba(0, 0, 0, 0.35)';

        ctxt.setFont("'Crimson Text', serif", 18);
        ctxt.setRubricColor(accentColor);
        ctxt.specialCharColor = accentColor;
        ctxt.rubricColor = accentColor;
        ctxt.lyricTextColor = isDark ? '#ffffff' : '#111317';
        ctxt.lyricTextFont = "'Crimson Text', serif";
        ctxt.annotationTextFont = ctxt.lyricTextFont;

        const processed = preprocessGabcForExsurge(piece.gabc_src);
        const mappings = exsurge.Gabc.createMappingsFromSource(ctxt, processed);
        const score = new exsurge.ChantScore(ctxt, mappings, true);

        // Calculate available width with safe fallback
        var availWidth = container.clientWidth || 700;
        if (availWidth < 360) availWidth = 360;
        ctxt.width = availWidth;

        score.performLayout(ctxt);

        score.layoutChantLines(ctxt, availWidth - 28, function() {
          container.innerHTML = '';
          const svgNode = score.createSvgNode(ctxt);
          svgNode.setAttribute('width', '100%');
          svgNode.style.width = '100%';
          svgNode.style.height = 'auto';
          svgNode.setAttribute('fill', isDark ? '#ffffff' : '#111317');
          container.appendChild(svgNode);

          currentScore = score;
          score.svg = svgNode;
          currentChantInfo = _getChantInfo(score);

          // Pre-bind SVG node references for high performance
          if (currentChantInfo && currentChantInfo.allNotes) {
            currentChantInfo.allNotes.forEach(function(n) {
              var el = null;
              if (n.elementIndex !== undefined) {
                el = svgNode.querySelector('use[element-index="' + n.elementIndex + '"]');
              }
              if (!el && n.sourceIndex !== undefined) {
                el = svgNode.querySelector('use[source-index="' + n.sourceIndex + '"]');
              }
              n.svgNode = el;
            });
          }

          setupScoreClicks(svgNode, currentChantInfo);
          highlightNote(0);
        });
      } catch(ex) {
        container.innerHTML = '<div style="padding:30px; color:var(--status-danger); text-align:center;">Erreur Exsurge : ' + ex.message + '</div>';
      }
    }

    function setupScoreClicks(svg, info) {
      if (!svg || !info) return;

      svg.addEventListener('click', function(e) {
        var target = e.target;
        var noteEl = target.closest('use[source-index], use[element-index]');
        var lyricEl = target.closest('text, tspan');

        var targetIndex = -1;

        if (noteEl) {
          for (var i = 0; i < info.allNotes.length; i++) {
            if (info.allNotes[i].svgNode === noteEl ||
                info.allNotes[i].sourceIndex == noteEl.getAttribute('source-index') ||
                info.allNotes[i].elementIndex == noteEl.getAttribute('element-index')) {
              targetIndex = i;
              break;
            }
          }
        } else if (lyricEl) {
          for (var j = 0; j < info.allNotes.length; j++) {
            var n = info.allNotes[j];
            if (n.neume && n.neume.lyrics && n.neume.lyrics.some(function(l) {
              return l.svgNode === lyricEl || lyricEl.contains(l.svgNode) || (l.svgNode && l.svgNode.contains(lyricEl));
            })) {
              targetIndex = j;
              break;
            }
          }
          if (targetIndex === -1) {
            var grp = lyricEl.closest('g.ChantNotationElement');
            if (grp) {
              var firstUse = grp.querySelector('use[source-index], use[element-index]');
              if (firstUse) {
                for (var k = 0; k < info.allNotes.length; k++) {
                  if (info.allNotes[k].svgNode === firstUse ||
                      info.allNotes[k].sourceIndex == firstUse.getAttribute('source-index') ||
                      info.allNotes[k].elementIndex == firstUse.getAttribute('element-index')) {
                    targetIndex = k;
                    break;
                  }
                }
              }
            }
          }
        }

        if (targetIndex >= 0) {
          if (currentPieceIndex >= 0 && PIECES && PIECES[currentPieceIndex]) {
            var stamps = PIECES[currentPieceIndex].timestamps;
            if (stamps && stamps[targetIndex] && stamps[targetIndex].start !== undefined) {
              var sec = stamps[targetIndex].start;
              if (ytPlayer && typeof ytPlayer.seekTo === 'function') {
                ytPlayer.seekTo(sec, true);
              }
            }
          }
          highlightNote(targetIndex);
        }
      });
    }

    function syncActiveNote(cur) {
      if (currentPieceIndex < 0 || !PIECES || !PIECES[currentPieceIndex]) return;
      const piece = PIECES[currentPieceIndex];
      const stamps = piece.timestamps;
      if (!stamps || stamps.length === 0) return;

      var noteIdx = -1;
      var hasReprise = piece.has_reprise && piece.reprise;

      // Filter sung notes
      var sungIndices = [];
      for (var s = 0; s < stamps.length; s++) {
        if (stamps[s].sung !== false && !stamps[s].omitted && stamps[s].start !== null && stamps[s].start !== undefined) {
          sungIndices.push(s);
        }
      }
      if (!sungIndices.length) return;
      var firstIdx = sungIndices[0];
      var lastIdx = sungIndices[sungIndices.length - 1];

      if (hasReprise && cur >= piece.reprise.start) {
        if (piece.reprise.notes && piece.reprise.notes.length > 0) {
          var rNotes = piece.reprise.notes;
          if (cur >= rNotes[rNotes.length - 1].start) {
            noteIdx = (rNotes[rNotes.length - 1].note_index !== undefined) ? rNotes[rNotes.length - 1].note_index : (rNotes.length - 1);
          } else {
            for (var r = 0; r < rNotes.length; r++) {
              var rNext = (r + 1 < rNotes.length) ? rNotes[r + 1].start : rNotes[r].end;
              if (cur >= rNotes[r].start && cur < rNext) {
                noteIdx = (rNotes[r].note_index !== undefined) ? rNotes[r].note_index : r;
                break;
              }
            }
          }
        } else {
          var antNotesCount = piece.reprise.antiphon_note_count || Math.min(90, stamps.length);
          if (cur >= piece.reprise.end) {
            noteIdx = antNotesCount - 1;
          } else {
            var repFraction = Math.min(1.0, (cur - piece.reprise.start) / Math.max(1, piece.reprise.duration));
            noteIdx = Math.min(antNotesCount - 1, Math.floor(repFraction * antNotesCount));
          }
        }
      } else if (hasReprise && cur >= stamps[lastIdx].start && cur < piece.reprise.start) {
        noteIdx = lastIdx;
      } else {
        if (cur < stamps[firstIdx].start) {
          noteIdx = firstIdx;
        } else if (!hasReprise && cur >= stamps[lastIdx].end) {
          noteIdx = lastIdx;
        } else {
          for (var k = 0; k < sungIndices.length; k++) {
            var sIdx = sungIndices[k];
            var curNote = stamps[sIdx];
            var nxtTime = (k + 1 < sungIndices.length) ? stamps[sungIndices[k + 1]].start : (hasReprise ? piece.reprise.start : curNote.end);
            if (cur >= curNote.start && cur < nxtTime) {
              noteIdx = sIdx;
              break;
            }
          }
          if (noteIdx === -1 && cur >= stamps[lastIdx].start) {
            noteIdx = lastIdx;
          }
        }
      }

      if (noteIdx >= 0 && noteIdx !== activeNoteIndex) {
        highlightNote(noteIdx);
      }
    }

    function highlightNote(idx) {
      if (!currentChantInfo || !currentChantInfo.allNotes || !currentChantInfo.allNotes.length) return;
      if (idx < 0 || idx >= currentChantInfo.allNotes.length) return;
      if (idx === activeNoteIndex && activeNoteEl && activeNoteEl.classList.contains('active')) return;

      activeNoteIndex = idx;
      const note = currentChantInfo.allNotes[idx];
      const accentColor = '#c96b63';

      // Un-highlight previous note
      if (activeNoteEl) {
        activeNoteEl.classList.remove('active', 'active-note-highlight', 'porrectus-left', 'porrectus-right');
        activeNoteEl.style.removeProperty('fill');
        activeNoteEl.style.removeProperty('stroke');
        activeNoteEl = null;
      }
      // Un-highlight previous lyric
      if (activeLyricEl) {
        activeLyricEl.classList.remove('active');
        activeLyricEl.style.removeProperty('fill');
        activeLyricEl.style.removeProperty('color');
        activeLyricEl.querySelectorAll('tspan').forEach(ts => {
          ts.classList.remove('active');
          ts.style.removeProperty('fill');
          ts.style.removeProperty('color');
        });
        activeLyricEl = null;
      }

      // Find note SVG node
      var noteElem = note.svgNode;
      if (!noteElem && currentScore && currentScore.svg) {
        if (note.elementIndex !== undefined) {
          noteElem = currentScore.svg.querySelector('use[element-index="' + note.elementIndex + '"]');
        }
        if (!noteElem && note.sourceIndex !== undefined) {
          noteElem = currentScore.svg.querySelector('use[source-index="' + note.sourceIndex + '"]');
        }
      }

      if (noteElem) {
        var href = noteElem.getAttribute('href') || (noteElem.attributes && noteElem.attributes['href'] ? noteElem.attributes['href'].value : '');
        if (href === '#None' && noteElem.previousSibling) {
          noteElem = noteElem.previousSibling;
          noteElem.classList.add('porrectus-right');
        } else if (/^#Porrectus/.test(href)) {
          noteElem.classList.add('porrectus-left');
        }

        noteElem.classList.add('active', 'active-note-highlight');
        noteElem.style.setProperty('fill', accentColor, 'important');
        activeNoteEl = noteElem;

        // Highlight corresponding lyric text
        var lyricEl = null;
        if (note.neume && note.neume.lyrics && note.neume.lyrics.length > 0 && note.neume.lyrics[0].svgNode) {
          lyricEl = note.neume.lyrics[0].svgNode;
        }
        if (!lyricEl) {
          var grp = noteElem.closest('g.ChantNotationElement') || noteElem.parentNode.parentNode;
          if (grp) lyricEl = grp.querySelector('text.lyric, text.dropCap, text.aboveLinesText, text');
        }
        if (lyricEl) {
          lyricEl.classList.add('active');
          lyricEl.style.setProperty('fill', accentColor, 'important');
          lyricEl.querySelectorAll('tspan').forEach(ts => {
            ts.classList.add('active');
            ts.style.setProperty('fill', accentColor, 'important');
          });
          activeLyricEl = lyricEl;
        }

        // Auto-scroll score line smoothly
        try {
          var lineEl = noteElem.closest('g.ChantLine');
          if (lineEl && lineEl.scrollIntoViewIfNeeded) {
            lineEl.scrollIntoViewIfNeeded({ block: 'nearest', behavior: 'smooth' });
          } else if (lineEl && lineEl.scrollIntoView) {
            lineEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          }
        } catch(e) {}
      }
    }

    // ── Tinder Gestures & Swipe Engine (Smooth & High Contrast) ──
    const card = document.getElementById('activeSwipeCard');
    const dragStrip = document.getElementById('cardDragStrip');
    const stampRight = document.getElementById('stampConforme');
    const stampLeft = document.getElementById('stampDecalage');
    const stampDown = document.getElementById('stampGabcFaux');

    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let isDragging = false;
    let isSwipeIntent = false;
    let isScrollIntent = false;

    function resetStamps() {
      stampRight.style.opacity = '0';
      stampRight.style.transform = 'rotate(-14deg) scale(0.9)';
      stampLeft.style.opacity = '0';
      stampLeft.style.transform = 'rotate(14deg) scale(0.9)';
      stampDown.style.opacity = '0';
      stampDown.style.transform = 'translateX(-50%) scale(0.9)';
    }

    function onPointerDown(e) {
      if (isTransitioning) return;
      // Do not start swipe on video player or buttons
      if (e.target.closest('#cardVideoSlot') || e.target.closest('button')) return;

      isDragging = true;
      isSwipeIntent = false;
      isScrollIntent = false;
      const pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
      startX = pt.clientX;
      startY = pt.clientY;
      currentX = pt.clientX;
      currentY = pt.clientY;
    }

    function onPointerMove(e) {
      if (!isDragging || isTransitioning) return;
      const pt = (e.touches && e.touches[0]) ? e.touches[0] : e;
      currentX = pt.clientX;
      currentY = pt.clientY;

      const deltaX = currentX - startX;
      const deltaY = currentY - startY;
      const absX = Math.abs(deltaX);
      const absY = Math.abs(deltaY);

      // Determine intent if not decided yet
      if (!isSwipeIntent && !isScrollIntent) {
        if (absX < 8 && absY < 8) {
          return; // Dead zone for click / tap
        }
        // If horizontal movement dominates: lock into SWIPE
        if (absX >= absY) {
          isSwipeIntent = true;
          card.style.transition = 'none';
        } else if (deltaY > 15 && absX < 15 && (e.target.closest('#cardDragStrip') || !e.target.closest('#cardScoreSlot'))) {
          // Downward swipe for GABC faux (when dragging strip or card frame)
          isSwipeIntent = true;
          card.style.transition = 'none';
        } else {
          // Vertical movement on scrollable score: allow natural score scroll
          isScrollIntent = true;
          return;
        }
      }

      if (isScrollIntent) return;

      // Prevent native horizontal bounce / navigation
      if (e.cancelable) {
        e.preventDefault();
      }

      // Drag physics: rotation proportional to horizontal distance
      const rotate = deltaX * 0.085;
      card.style.transform = `translate(${deltaX}px, ${deltaY * 0.4}px) rotate(${rotate}deg)`;

      const progressX = Math.min(1, absX / 90);
      const progressY = Math.min(1, Math.max(0, deltaY) / 80);

      if (deltaX > 20) {
        // Conforme (Right)
        stampRight.style.opacity = progressX;
        stampRight.style.transform = `rotate(-14deg) scale(${0.9 + progressX * 0.25})`;
        stampLeft.style.opacity = '0';
        stampDown.style.opacity = '0';
        card.style.borderColor = `rgba(16, 185, 129, ${progressX * 0.8})`;
        card.style.boxShadow = `0 16px 40px rgba(16, 185, 129, ${progressX * 0.4})`;
      } else if (deltaX < -20) {
        // Décalage (Left)
        stampLeft.style.opacity = progressX;
        stampLeft.style.transform = `rotate(14deg) scale(${0.9 + progressX * 0.25})`;
        stampRight.style.opacity = '0';
        stampDown.style.opacity = '0';
        card.style.borderColor = `rgba(245, 158, 11, ${progressX * 0.8})`;
        card.style.boxShadow = `0 16px 40px rgba(245, 158, 11, ${progressX * 0.4})`;
      } else if (deltaY > 25) {
        // GABC faux (Down)
        stampDown.style.opacity = progressY;
        stampDown.style.transform = `translateX(-50%) scale(${0.9 + progressY * 0.25})`;
        stampRight.style.opacity = '0';
        stampLeft.style.opacity = '0';
        card.style.borderColor = `rgba(239, 68, 68, ${progressY * 0.8})`;
        card.style.boxShadow = `0 16px 40px rgba(239, 68, 68, ${progressY * 0.4})`;
      } else {
        resetStamps();
        card.style.borderColor = 'var(--border-subtle)';
        card.style.boxShadow = '0 10px 30px rgba(0, 0, 0, 0.3)';
      }
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;

      if (!isSwipeIntent) {
        isScrollIntent = false;
        return;
      }
      isScrollIntent = false;
      isSwipeIntent = false;

      const deltaX = currentX - startX;
      const deltaY = currentY - startY;
      const threshold = 75;

      if (deltaX > threshold) {
        triggerVote('approved');
      } else if (deltaX < -threshold) {
        triggerVote('rejected');
      } else if (deltaY > threshold && Math.abs(deltaX) < 60) {
        triggerVote('bad_gabc');
      } else {
        // Snap smoothly back to center
        card.style.transition = 'transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s ease, box-shadow 0.2s ease';
        card.style.transform = 'translate(0, 0) rotate(0deg)';
        card.style.borderColor = 'var(--border-subtle)';
        card.style.boxShadow = '0 10px 30px rgba(0, 0, 0, 0.3)';
        resetStamps();
      }
    }

    // Attach drag events to drag strip and card
    dragStrip.addEventListener('mousedown', onPointerDown);
    card.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    dragStrip.addEventListener('touchstart', onPointerDown, { passive: true });
    card.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // Keyboard Shortcuts (ArrowRight = Conforme, ArrowLeft = Décalage, ArrowDown = GABC faux)
    window.addEventListener('keydown', function(e) {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        triggerVote('approved');
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        triggerVote('rejected');
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        triggerVote('bad_gabc');
      } else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        if (ytPlayer && ytPlayer.getPlayerState) {
          if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
          else ytPlayer.playVideo();
        }
      } else if (e.key === 'Backspace' || (e.ctrlKey && e.key === 'z')) {
        e.preventDefault();
        undoLastVote();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        openCommentModal();
      } else if (e.key === 'Escape') {
        closeCommentModal();
        closeHistoryModal();
      }
    });

    // ── Comment Modal & Button ──
    function openCommentModal() {
      if (currentPieceIndex < 0 || !PIECES || !PIECES[currentPieceIndex]) return;
      const piece = PIECES[currentPieceIndex];
      const rev = LAB_REVIEWS[piece.id] || {};
      const textarea = document.getElementById('chantCommentInput');
      textarea.value = rev.comment || '';
      document.getElementById('commentModal').style.display = 'flex';
      setTimeout(() => { textarea.focus(); }, 100);
    }

    function closeCommentModal() {
      document.getElementById('commentModal').style.display = 'none';
    }

    function saveChantComment() {
      if (currentPieceIndex < 0 || !PIECES || !PIECES[currentPieceIndex]) return;
      const piece = PIECES[currentPieceIndex];
      const text = document.getElementById('chantCommentInput').value.trim();

      if (!LAB_REVIEWS[piece.id]) {
        LAB_REVIEWS[piece.id] = {};
      }
      LAB_REVIEWS[piece.id].comment = text;
      if (!LAB_REVIEWS[piece.id].reviewedAt) {
        LAB_REVIEWS[piece.id].reviewedAt = new Date().toISOString();
      }

      try {
        localStorage.setItem('oremus_lab_reviews', JSON.stringify(LAB_REVIEWS));
      } catch(e) {}

      fetch('/api/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          piece_id: piece.id,
          status: LAB_REVIEWS[piece.id].status || 'unreviewed',
          comment: text,
          reviewedAt: LAB_REVIEWS[piece.id].reviewedAt,
          title: piece.title || piece.incipit || '',
          incipit: piece.incipit || '',
          youtube_id: piece.youtube_id || ''
        })
      }).catch(e => console.warn('Sync comment failed:', e));

      updateCommentButtonState();
      closeCommentModal();
      showToast('Commentaire enregistré');
    }

    function updateCommentButtonState() {
      const btn = document.getElementById('btnComment');
      if (!btn) return;
      if (currentPieceIndex >= 0 && PIECES && PIECES[currentPieceIndex]) {
        const p = PIECES[currentPieceIndex];
        const r = LAB_REVIEWS[p.id];
        if (r && r.comment && r.comment.trim().length > 0) {
          btn.classList.add('has-comment');
          btn.setAttribute('title', 'Commentaire : ' + r.comment);
        } else {
          btn.classList.remove('has-comment');
          btn.setAttribute('title', 'Ajouter un commentaire (touche C)');
        }
      } else {
        btn.classList.remove('has-comment');
      }
    }

    // Close modals on overlay backdrop click
    document.addEventListener('DOMContentLoaded', function() {
      const cm = document.getElementById('commentModal');
      if (cm) {
        cm.addEventListener('click', function(e) {
          if (e.target === this) closeCommentModal();
        });
      }
      const hm = document.getElementById('historyModal');
      if (hm) {
        hm.addEventListener('click', function(e) {
          if (e.target === this) closeHistoryModal();
        });
      }
      const ci = document.getElementById('chantCommentInput');
      if (ci) {
        ci.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            saveChantComment();
          } else if (e.key === 'Escape') {
            e.preventDefault();
            closeCommentModal();
          }
        });
      }
    });

    // ── History Modal ──
    function openHistoryModal() {
      const modal = document.getElementById('historyModal');
      const tbody = document.getElementById('historyTbody');
      tbody.innerHTML = '';

      const list = [];
      if (PIECES) {
        PIECES.forEach((p, idx) => {
          const r = LAB_REVIEWS[p.id];
          if (r && r.status) list.push({ p, idx, r });
        });
      }

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--text-tertiary);">Aucun chant vérifié.</td></tr>';
      } else {
        list.reverse().forEach(({ p, idx, r }) => {
          const tr = document.createElement('tr');
          let label = r.status === 'approved' ? 'Conforme' : (r.status === 'rejected' ? 'Décalage' : 'GABC faux');
          let color = r.status === 'approved' ? 'var(--status-success)' : (r.status === 'rejected' ? 'var(--status-warning)' : 'var(--status-danger)');

          let commentHtml = (r.comment && r.comment.trim()) ? `<div style="font-size:0.75rem; color:var(--text-tertiary); margin-top:2px;">${r.comment.replace(/</g, '&lt;')}</div>` : '';
          tr.innerHTML = `
            <td style="padding:8px 6px; color:${color}; font-weight:600; vertical-align:top;">${label}</td>
            <td style="padding:8px 6px; font-family:'Crimson Text', serif; font-size:0.95rem; vertical-align:top;">
              ${p.incipit}
              ${commentHtml}
            </td>
            <td style="padding:8px 6px; color:var(--text-secondary); vertical-align:top;">${p.part}</td>
            <td style="padding:8px 6px; text-align:right; vertical-align:top;"><button class="tinder-icon-btn" onclick="closeHistoryModal(); loadPiece(${idx});" style="display:inline-flex;">Ouvrir</button></td>
          `;
          tbody.appendChild(tr);
        });
      }
      modal.style.display = 'flex';
    }

    function closeHistoryModal() {
      document.getElementById('historyModal').style.display = 'none';
    }

    function exportReviewsJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(LAB_REVIEWS, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = "lab_reviews.json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Fichier exporté.');
    }

    // ── Initializer: Opens Directly on Random Chant ──
    function init() {
      initReviews();
      pickNextRandomChant();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
