apply plugin: 'com.android.application'

android {
    namespace = "com.chanttools.divinumofficium"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.chanttools.divinumofficium"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 53
        versionName "beta-0.0.53"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "android"
            keyAlias "androidreleasekey"
            keyPassword "android"
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Runtime web assets only — no tools, tests, Help HTML, or unused JS/CSS.
task copyWebAssets(type: Copy) {
    def projectRoot = rootProject.projectDir.parentFile
    def assetsPublic = file("src/main/assets/public")

    doFirst {
        delete assetsPublic
        assetsPublic.mkdirs()
    }

    from(projectRoot) {
        include "divinum-officium.html"
        include "index.html"

        include "jquery.min.js"
        include "moment.min.js"
        include "moment.easter.js"
        include "propersdata.js"
        include "ordinarydata.js"
        include "miscChants.js"
        include "incipits.js"
        include "util.js"
        include "exsurge.min.js"
        include "jquery.hypher.js"
        include "do_manifest.js"

        include "css/modern.css"
        include "css/divinum_officium.css"
        include "css/gregorian_search.css"

        include "js/Tone.min.js"
        include "js/tones.js"
        include "js/bible_mappings.js"
        include "js/divinum_officium.js"
        include "js/gregorian_db.js"
        include "js/gregorian_index_data.js"
        include "js/gregorian_search_engine.js"
        include "js/gregorian_search_worker.js"
        include "js/gregorian_search_ui.js"
        include "js/vendor/**"
        include "js/saints_art_metadata.js"
        include "js/tempora_art_metadata.js"

        include "data/**"

        include "img/saints/**"
        include "img/tempora/**"

        include "patterns/la-hypher.js"
        include "patterns/fr-FR.js"
        include "patterns/en-us.js"
        include "patterns/it.js"
        include "patterns/pl.js"

        include "icon/**"

        include "notifications.json"
        include "version.json"

        include "do_data/**/*.txt"
        include "gabc/**/*.gabc"
        include "vulgate/**/*.txt"
        include "crampon/**/*.txt"
        include "douay-rheims/**/*.txt"
        include "matos-soares/**/*.txt"
        include "psalms/**/*.txt"

        exclude "douay-rheims/src/**"
        exclude "do_data/**/Help/**"
    }

    into assetsPublic
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

preBuild.dependsOn copyWebAssets

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
