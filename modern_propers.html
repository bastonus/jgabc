<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mass Propers - ChantTools</title>

    <!-- Favicon -->
    <link rel="icon" href="icon/clear-main.png" type="image/png" />

    <!-- Fonts: Inter, Libre Baskerville & Crimson Text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/modern.css">

    <!-- Dependencies -->
    <script src="jquery.min.js"></script>
    <script src="jquery.autosize-min.js"></script>
    <script src="js/Tone.min.js"></script>
    <script src="js/tones.js"></script>
    <script src="util.js"></script>
    <script src="psalmtone.js"></script>
    <script src="moment.min.js"></script>
    <script src="moment.easter.js"></script>
    <script src="propersdata.js"></script>
    <script src="lectiones.js"></script>
    <script src="ordinarydata.js"></script>
    <script src="miscChants.js"></script>
    <script src="propersdatanovus.js"></script>
    <script src="verseRef.js"></script>
    <script src="exsurge.min.js"></script>
    <script src="incipits.js"></script>
    <script src="jquery.hypher.js"></script>
    <script src="patterns/la-hypher.js"></script>
    <script src="patterns/en-us.js"></script>
    <script src="patterns/fr-FR.js"></script>

    <!-- Logic -->
    <script src="js/chant_editing.js"></script>
    <script src="js/mobile_propers.js"></script>
</head>

<body>

    <div class="app-container">
        <!-- Sticky Header -->
        <header class="app-header">
            <div class="header-title-area">
                <div id="greetingTime" class="card-type">Mass Propers</div>
                <h1 id="headerTitle" class="header-title dropdown-trigger" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                    <span class="title-text">Loading...</span>
                    <span class="dropdown-icon" style="display:none; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--background-highlight); border:1px solid var(--border-color); color:var(--text-secondary); transition: all 0.2s ease;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px; height:14px;"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </span>
                </h1>
            </div>
            <div class="header-actions">
                <button id="btnSettings" class="icon-btn" aria-label="Settings" title="Settings">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Hidden selects: populated by JS, used by openHeaderDropdown() -->
        <div style="display:none" aria-hidden="true">
            <select id="selSunday"></select>
            <select id="selSundayNovus"></select>
            <select id="selSaint"></select>
            <select id="selMass"></select>
        </div>

        <!-- Main Content Stream -->
        <main class="app-main">
            <!-- Ad Libitum search (shown only on that tab) -->
            <div id="adlibitumSearch" class="adlibitum-body-search hidden" style="margin-bottom: 20px;">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input id="searchAdlibitum" type="text" class="search-input" placeholder="Quaere cantum per incipit..." autocomplete="off" autocorrect="off" spellcheck="false">
                    <div id="searchDropdown" class="search-dropdown hidden"></div>
                </div>
            </div>

            <div id="content-stream" class="content-area">
                <!-- Dynamic Cards Injected Here -->
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="bottom-nav-inner">
                <a href="#" class="nav-item active" data-tab="temporum">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    <span>Temporum</span>
                </a>
                <a href="#" class="nav-item" data-tab="sanctorum">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>Sanctorum</span>
                </a>
                <a href="#" class="nav-item" data-tab="communia">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 3v4c0 2.2 1.8 4 4 4s4-1.8 4-4V3"></path>
                        <line x1="6" y1="3" x2="18" y2="3"></line>
                        <path d="M12 11v7"></path>
                        <path d="M8 21h8"></path>
                    </svg>
                    <span>Votiv&aelig;</span>
                </a>
                <a href="#" class="nav-item" data-tab="adlibitum">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <span>Ad&nbsp;libitum</span>
                </a>
            </div>
        </nav>
    </div>



    <!-- Settings Panel -->
    <div id="settingsBackdrop" class="settings-backdrop"></div>
    <aside id="settingsPanel" class="settings-panel">
        <div class="settings-header">
            <h2>Settings</h2>
            <button id="btnCloseSettings" class="icon-btn" aria-label="Close">&times;</button>
        </div>
        <div class="settings-body">
            <!-- Ritus -->
            <div class="settings-group">
                <label class="settings-label">Ritus</label>
                <div class="year-segments" id="riteOptions">
                    <button class="segment active" data-value="traditional">Vetus Ordo</button>
                    <button class="segment" data-value="novus">Novus Ordo</button>
                </div>
            </div>
            <!-- Annus Liturgicus -->
            <div class="settings-group" id="settingsNovusYear" style="display:none;">
                <label class="settings-label">Annus Liturgicus</label>
                <div class="year-segments" id="yearSelector">
                    <button class="segment active" data-val="A">Annus A</button>
                    <button class="segment" data-val="B">Annus B</button>
                    <button class="segment" data-val="C">Annus C</button>
                </div>
            </div>
            <!-- Thema -->
            <div class="settings-group">
                <label class="settings-label">Thema</label>
                <div class="settings-options" id="themeOptions">
                    <button class="settings-option" data-value="light">Diurnum</button>
                    <button class="settings-option" data-value="dark">Nocturnum</button>
                    <button class="settings-option" data-value="auto">Automaticum</button>
                </div>
            </div>
            <!-- Color -->
            <div class="settings-group">
                <label class="settings-label">Color</label>
                <div class="settings-colors" id="colorOptions">
                    <button class="color-swatch" data-color="#337ab7" style="background:#337ab7" title="Caeruleus"></button>
                    <button class="color-swatch" data-color="#8b5cf6" style="background:#8b5cf6" title="Violaceus"></button>
                    <button class="color-swatch" data-color="#c0392b" style="background:#c0392b" title="Rubeus"></button>
                    <button class="color-swatch" data-color="#27ae60" style="background:#27ae60" title="Viridis"></button>
                    <button class="color-swatch" data-color="#d4a017" style="background:#d4a017" title="Aureus"></button>
                    <button class="color-swatch" data-color="#e67e22" style="background:#e67e22" title="Croceus"></button>
                </div>
            </div>
            <!-- Lingua Lectionum -->
            <div class="settings-group">
                <label class="settings-label">Lingua Lectionum</label>
                <div class="settings-options" id="langOptions">
                    <button class="settings-option" data-value="la">Latina</button>
                    <button class="settings-option" data-value="en">Anglica</button>
                    <button class="settings-option" data-value="fr">Gallica</button>
                </div>
            </div>
            <!-- Ordinarium Missæ -->
            <div class="settings-group">
                <label class="settings-label">Ordinarium Miss&aelig;</label>
                <select id="selOrdinary" class="modern-select" style="width:100%;margin-top:6px;"></select>
            </div>
        </div>
    </aside>

    <!-- Modern Sticky Player Bar -->
    <div id="modernPlayerBar" class="modern-player-bar">
        <!-- Progress Bar -->
        <div id="playerProgressBarContainer" class="player-progress-container">
            <div class="player-progress-bar">
                <div id="playerProgressFill" class="player-progress-fill"></div>
            </div>
        </div>
        <div class="player-bar-inner">
            <!-- Chant info (Title only) -->
            <div class="player-info">
                <div class="player-note-icon">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </div>
                <div class="player-meta">
                    <div id="playerChantName" class="player-chant-name">—</div>
                </div>
            </div>

            <!-- Controls (Stop, Play, Next) -->
            <div class="player-controls">
                <button id="playerBtnStop" class="player-btn player-btn-secondary" title="Stop">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
                </button>
                <button id="playerBtnPlay" class="player-btn player-btn-primary" title="Play">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
                <button id="playerBtnNext" class="player-btn player-btn-secondary" title="Next Note">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><polygon points="5 4 15 12 5 20 5 4"></polygon><rect x="17" y="4" width="3" height="16"></rect></svg>
                </button>
            </div>

            <!-- Options (Pitch, Range, Solesmes, Tempo) -->
            <div class="player-options">
                <!-- Pitch Transpose -->
                <div class="player-pitch-group" style="display:flex; align-items:center; gap:4px;">
                    <button id="playerPitchDown" class="player-btn-option" title="Transpose Down">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <span id="playerStartingPitch" style="font-weight:bold; color:var(--primary-color); font-size:0.9rem; min-width:24px; text-align:center;">?</span>
                    <button id="playerPitchUp" class="player-btn-option" title="Transpose Up">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="18 15 12 9 6 15"></polyline></svg>
                    </button>
                </div>

                <!-- Divider -->
                <div style="width:1px; height:20px; background:var(--border-color, rgba(0,0,0,0.1)); margin: 0 4px;"></div>

                <!-- Solesmes Toggle -->
                <button id="playerBtnSolesmes" class="player-btn-option" title="Toggle Solesmes Lengths" style="margin-right: 4px;">
                    <img src="salicus.svg" alt="Solesmes" style="height:14px; filter: invert(0) opacity(0.8);">
                </button>
                
                <!-- Tempo Controls -->
                <div class="player-tempo-group" style="display:flex; align-items:center; gap:4px;">
                    <button class="player-btn-option tempo-minus" title="Slower">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <span id="playerTempoValue" class="tempo-value" style="font-size:0.85rem; font-weight:600; min-width:60px; text-align:center;">150 BPM</span>
                    <button class="player-btn-option tempo-plus" title="Faster">
                        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><polyline points="18 15 12 9 6 15"></polyline></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
